name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run CI pipeline
        uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          args: ci --source=.
          version: "latest"

  publish:
    name: Build and push
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend
        uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          args: build-frontend --source=. export --path=./frontend-dist
          version: "latest"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/turtleful/arbour
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=next,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [ci, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the notes step can diff against the previous tag
          fetch-depth: 0

      # GitHub's --generate-notes builds notes from merged PRs, which stay
      # empty for direct-to-main commits — so build them from the commit log
      # between the previous tag and this one, grouped by conventional prefix.
      - name: Generate release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
          else
            range="$tag"
          fi

          commits="$(git log --no-merges --pretty='- %s (%h)' "$range")"
          feats="$(printf '%s\n' "$commits" | grep -E '^- feat(\(|:|!)' || true)"
          fixes="$(printf '%s\n' "$commits" | grep -E '^- fix(\(|:|!|es )' || true)"
          other="$(printf '%s\n' "$commits" | grep -vE '^- (feat|fix)(\(|:|!|es )' | grep -v '^- chore: release' || true)"

          {
            if [ -n "$feats" ]; then printf '## Features\n%s\n\n' "$feats"; fi
            if [ -n "$fixes" ]; then printf '## Fixes\n%s\n\n' "$fixes"; fi
            if [ -n "$other" ]; then printf '## Other changes\n%s\n\n' "$other"; fi
            if [ -n "$prev" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$tag"
            fi
          } > release-notes.md

      - name: Create release
        run: gh release create "${{ github.ref_name }}" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
